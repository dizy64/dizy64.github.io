<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 263" width="560" height="263" role="img" aria-labelledby="title desc"><title id="title">집 안 전송 · 설정 적용 전후</title><desc id="desc">다운로드 113에서 282Mbps, 업로드 333에서 261Mbps로 변경. 같은 방식으로 전후 네 번씩 잰 중앙값.</desc><style>svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color-scheme:light dark}.panel{fill:#f8fafc;stroke:#e2e8f0}.ink{fill:#172536}.muted{fill:#526174}.rail{fill:#e5ebf2}.old{fill:#62768e}.new{fill:#006e64}@media(prefers-color-scheme:dark){.panel{fill:#15202c;stroke:#2d3a47}.ink{fill:#f2f6fb}.muted{fill:#b6c4d4}.rail{fill:#263442}.old{fill:#8fa6bd}.new{fill:#43baaa}}</style><rect class="panel" x=".5" y=".5" width="559" height="262" rx="16"/><text x="26" y="37" font-size="24" font-weight="750" class="ink">집 안 전송 · 설정 적용 전후</text><text x="534" y="35" text-anchor="end" font-size="17" class="muted">Mbps</text><text x="26" y="75" font-size="18" class="ink" font-weight="650">다운로드</text><text x="26" y="102" class="muted" font-size="17">적용 전</text><rect x="132" y="89" width="327" height="15" rx="4" class="rail"/><rect x="132" y="89" width="105.6" height="15" rx="4" class="old"/><text x="532" y="103" text-anchor="end" class="ink" font-size="20" font-weight="700">113</text><text x="26" y="130" class="muted" font-size="17">적용 후</text><rect x="132" y="117" width="327" height="15" rx="4" class="rail"/><rect x="132" y="117" width="263.5" height="15" rx="4" class="new"/><text x="532" y="131" text-anchor="end" class="ink" font-size="20" font-weight="700">282</text><text x="26" y="167" font-size="18" class="ink" font-weight="650">업로드</text><text x="26" y="194" class="muted" font-size="17">적용 전</text><rect x="132" y="181" width="327" height="15" rx="4" class="rail"/><rect x="132" y="181" width="311.1" height="15" rx="4" class="old"/><text x="532" y="195" text-anchor="end" class="ink" font-size="20" font-weight="700">333</text><text x="26" y="222" class="muted" font-size="17">적용 후</text><rect x="132" y="209" width="327" height="15" rx="4" class="rail"/><rect x="132" y="209" width="243.8" height="15" rx="4" class="new"/><text x="532" y="223" text-anchor="end" class="ink" font-size="20" font-weight="700">261</text><text x="26" y="244" class="muted" font-size="16">같은 공유기 · 적용 전후 각 4회 측정 중앙값</text></svg>
