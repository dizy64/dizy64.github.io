<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" role="img" aria-labelledby="title desc"><title id="title">맥북 인터넷 속도 · 5GHz</title><desc id="desc">Cloudflare로 측정한 인터넷 속도. 처음 다운로드 232–241 Mbps, 업로드 약 63 Mbps. 마지막 다운로드 235 Mbps, 업로드 263 Mbps로 각각 세 번 측정한 중앙값. 서로 다른 날짜에 측정했으며 다운로드는 비슷하고 업로드는 약 네 배.</desc><style>svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color-scheme:light dark}.panel{fill:#f8fafc;stroke:#e2e8f0}.ink{fill:#172536}.muted{fill:#526174}.rail{fill:#e5ebf2}.old{fill:#62768e}.new{fill:#006e64}@media(prefers-color-scheme:dark){.panel{fill:#15202c;stroke:#2d3a47}.ink{fill:#f2f6fb}.muted{fill:#b6c4d4}.rail{fill:#263442}.old{fill:#8fa6bd}.new{fill:#43baaa}}</style><rect class="panel" x=".5" y=".5" width="559" height="289" rx="16"/><text x="26" y="37" font-size="24" font-weight="750" class="ink">맥북 인터넷 속도 · 5GHz</text><text x="534" y="35" text-anchor="end" font-size="17" class="muted">Mbps</text><text x="26" y="75" class="ink" font-size="18" font-weight="650">다운로드</text><text x="26" y="103" class="muted" font-size="17">처음</text><rect x="132" y="89" width="306" height="15" rx="4" class="rail"/><rect x="132" y="89" width="236.6" height="15" rx="4" class="old"/><rect x="367.6" y="89" width="9.2" height="15" rx="2" class="old" opacity=".45"/><text x="534" y="103" text-anchor="end" class="ink" font-size="20" font-weight="700">232–241</text><text x="26" y="131" class="muted" font-size="17">마지막</text><rect x="132" y="117" width="306" height="15" rx="4" class="rail"/><rect x="132" y="117" width="239.7" height="15" rx="4" class="new"/><text x="534" y="131" text-anchor="end" class="ink" font-size="20" font-weight="700">235</text><text x="26" y="167" class="ink" font-size="18" font-weight="650">업로드</text><text x="26" y="195" class="muted" font-size="17">처음</text><rect x="132" y="181" width="306" height="15" rx="4" class="rail"/><rect x="132" y="181" width="64.3" height="15" rx="4" class="old"/><text x="534" y="195" text-anchor="end" class="ink" font-size="20" font-weight="700">약 63</text><text x="26" y="223" class="muted" font-size="17">마지막</text><rect x="132" y="209" width="306" height="15" rx="4" class="rail"/><rect x="132" y="209" width="268.3" height="15" rx="4" class="new"/><text x="534" y="223" text-anchor="end" class="ink" font-size="20" font-weight="700">263</text><text x="26" y="254" class="muted" font-size="16">Cloudflare · 11월 23일 처음 5GHz로 옮긴 뒤 측정</text><text x="26" y="276" class="muted" font-size="16">11월 25일 재측정 · 마지막 값은 3회 중앙값</text></svg>
